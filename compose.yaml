name: mcp-agent

services:
  api:
    image: ${MCP_IMAGE:-mcp-agent:local}
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4).close()
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    image: ${MCP_IMAGE:-mcp-agent:local}
    profiles: [tools]
    command: [python, -m, server.migrate]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
